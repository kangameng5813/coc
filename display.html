<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISPLAY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- MathJax untuk Render Rumus Matematika -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      background: radial-gradient(circle at center, #1b333a 0%, #0d171c 100%);
      font-family: 'Times New Roman', Times, serif;
    }

    @keyframes pulse-banner {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .animate-pop { animation: pulse-banner 0.3s ease-out; }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between p-8 font-sans select-none relative">

  <!-- Overlay Interaksi Pertama -->
  <div id="start-overlay" class="fixed inset-0 bg-[#0d171c]/95 z-50 flex flex-col items-center justify-center cursor-pointer text-center p-6 transition-opacity duration-300">
    <div class="border-2 border-[#7a8a9e] bg-[#1b333a] p-8 rounded-2xl shadow-[0_0_20px_rgba(122,138,158,0.4)] max-w-sm w-full">
      <div class="text-4xl mb-4">⚔️</div>
      <h2 class="text-white text-xl font-bold mb-2 tracking-wide">Clash of Champions SMANJ@</h2>
      <p class="text-[#9aa3ab] text-sm mb-6">Klik di mana saja untuk mulai permainan dan mengaktifkan suara.</p>
      <button class="bg-[#7a8a9e] text-[#0d171c] font-extrabold px-6 py-3 rounded-xl tracking-wider shadow-md hover:bg-[#8fa0b5] transition">
        KETUK UNTUK MULAI
      </button>
    </div>
  </div>

  <!-- Header -->
  <header class="flex justify-between items-center border-b-2 border-slate-700/50 pb-4">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl md:text-3xl font-extrabold text-teal-400 tracking-wider drop-shadow">Clash of Champions SMANJ@</h1>
    </div>
    
    <div class="flex items-center gap-4">
      <button id="enable-audio-btn" onclick="enableAudio()" class="bg-amber-500 hover:bg-amber-600 text-black font-bold px-4 py-2 rounded-full text-xs shadow-md transition flex items-center gap-1">
        🔊 Aktifkan Suara
      </button>

      <div class="bg-[#1b333a] text-teal-200 font-bold px-4 py-2 rounded-full border border-teal-500/40 shadow">
        Soal Ke: <span id="question-number" class="text-teal-400 text-xl">1</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-center my-6 text-center">
    <div class="w-full max-w-3xl bg-[#132228]/80 border-2 border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center min-h-[300px] backdrop-blur-sm">
      
      <div id="image-container" class="mb-4 hidden">
        <img id="question-image" src="" alt="Gambar Soal" class="max-h-72 max-w-full rounded-xl border border-slate-600 shadow-md object-contain" />
      </div>

      <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-100 leading-relaxed drop-shadow">
        Menyiapkan Permainan...
      </h2>
    </div>

    <div id="notification-box" class="mt-6 h-16 flex items-center justify-center w-full max-w-md"></div>
  </main>

  <!-- Footer / Watermark -->
  <footer class="text-center text-slate-400 text-sm border-t border-slate-800 pt-4 flex flex-col sm:flex-row justify-between items-center gap-2">
    <span>Gunakan HP Anda untuk memasukkan jawaban.</span>
    <span class="text-teal-400/80 font-mono tracking-wider font-semibold">guru-smanj.blogspot.com</span>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAfT0bE5CfBIGvzsG_MCSkkKjnnaExlE0o",
      authDomain: "coc-gurusmanj.firebaseapp.com",
      databaseURL: "https://coc-gurusmanj-default-rtdb.firebaseio.com",
      projectId: "coc-gurusmanj",
      storageBucket: "coc-gurusmanj.firebasestorage.app",
      messagingSenderId: "183089432197",
      appId: "1:183089432197:web:67b413ee1ded658ba9cbec"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🎵 Inisialisasi Objek Audio MP3
    const audioBacksound = new Audio('back_sound.mp3');
    audioBacksound.loop = true;

    const audioSelamatDatang = new Audio('selamat_datang.mp3');
    const audioPedang = new Audio('pedang.mp3');
    const audioBenar = new Audio('benar.mp3');
    const audioSalah = new Audio('salah.mp3');

    let audioUnlocked = false;
    let gameStarted = false;
    let questionsKeys = [];
    let questionsData = {};
    let currentIndex = 0;

    function enableAudio() {
      if (audioUnlocked) return;
      
      // Putar backsound & selamat datang
      audioBacksound.play().catch(e => console.log("Backsound error:", e));
      audioSelamatDatang.play().catch(e => console.log("Selamat datang error:", e));
      
      audioPedang.currentTime = 0;
      audioPedang.play().then(() => {
        audioUnlocked = true;
      }).catch(e => console.log("Audio play error:", e));

      [audioBenar, audioSalah].forEach(aud => {
        aud.play().then(() => { aud.pause(); aud.currentTime = 0; }).catch(() => {});
      });

      const btn = document.getElementById('enable-audio-btn');
      if (btn) {
        btn.className = "bg-emerald-500 text-white font-bold px-4 py-2 rounded-full text-xs shadow-md transition flex items-center gap-1 cursor-default";
        btn.innerText = "🔊 Suara Siap";
        btn.onclick = null;
      }
    }

    const overlay = document.getElementById('start-overlay');
    overlay.addEventListener('click', () => {
      enableAudio();
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
        
        // Mulai hitung mundur 15 detik setelah layar diklik/overlay ditutup
        document.getElementById('question-text').innerText = "Bersiap... Menyambut peserta!";
        
        setTimeout(() => {
          gameStarted = true;
          loadAndShowCurrentQuestion();
        }, 15000); // Penundaan 15 detik (sesuai durasi selamat_datang.mp3)

      }, 300);
    });

    // Baca seluruh data soal dan kunci uniknya dari Firebase
    db.ref('questions').on('value', (snapshot) => {
      const data = snapshot.val();
      questionsKeys = [];
      questionsData = {};
      
      if (data) {
        questionsData = data;
        questionsKeys = Object.keys(data);
      }
      
      db.ref('game/currentQuestion').once('value').then((snap) => {
        currentIndex = snap.val() !== null ? snap.val() : 0;
        if (gameStarted) {
          showQuestion(currentIndex);
        }
      });
    });

    db.ref('game/currentQuestion').on('value', (snapshot) => {
      const val = snapshot.val();
      if (val !== null && val !== currentIndex) {
        currentIndex = val;
        if (gameStarted) {
          showQuestion(currentIndex);
        }
      }
    });

    function loadAndShowCurrentQuestion() {
      db.ref('game/currentQuestion').once('value').then((snap) => {
        currentIndex = snap.val() !== null ? snap.val() : 0;
        showQuestion(currentIndex);
      });
    }

    function showQuestion(index) {
      const imgContainer = document.getElementById('image-container');
      const imgEl = document.getElementById('question-image');
      const textEl = document.getElementById('question-text');
      const numEl = document.getElementById('question-number');

      if (questionsKeys.length === 0) {
        numEl.innerText = "-";
        imgContainer.classList.add('hidden');
        textEl.innerText = "Belum ada soal. Silakan tambah via Admin Panel!";
        return;
      }

      if (index < questionsKeys.length) {
        const currentKey = questionsKeys[index];
        const questionItem = questionsData[currentKey];

        // Jika soal dinonaktifkan oleh admin (active === false), cari soal aktif berikutnya
        if (questionItem.active === false) {
          let nextActiveIndex = index + 1;
          while (nextActiveIndex < questionsKeys.length) {
            if (questionsData[questionsKeys[nextActiveIndex]].active !== false) {
              db.ref('game').update({ currentQuestion: nextActiveIndex });
              return;
            }
            nextActiveIndex++;
          }
          numEl.innerText = "-";
          imgContainer.classList.add('hidden');
          textEl.innerText = "Permainan Selesai/belum siap!";
          audioBacksound.pause();
          return;
        }

        numEl.innerText = index + 1;
        textEl.innerText = questionItem.q || "";

        if (questionItem.img) {
          imgEl.src = questionItem.img;
          imgContainer.classList.remove('hidden');
        } else {
          imgContainer.classList.add('hidden');
          imgEl.src = "";
        }
      } else {
        numEl.innerText = "-";
        imgContainer.classList.add('hidden');
        textEl.innerText = "Permainan Selesai/Belum Siap";
        audioBacksound.pause();
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([textEl]);
      }
    }

    // Listener aktivitas permainan (Benar / Salah)
    db.ref('game').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const notifBox = document.getElementById('notification-box');

      if (data.lastResult === "CORRECT") {
        audioBenar.currentTime = 0;
        audioBenar.play().catch(e => console.log("Gagal memutar audio:", e));

        notifBox.innerHTML = `
          <div class="bg-emerald-600 text-white font-bold text-xl px-8 py-3 rounded-xl shadow-lg animate-pop">
            ✅ Jawaban Benar!
          </div>`;
        
        setTimeout(() => {
          audioPedang.currentTime = 0;
          audioPedang.play().catch(e => console.log("Gagal memutar audio:", e));
        }, 700);

        setTimeout(() => {
          notifBox.innerHTML = "";
          currentIndex = data.currentQuestion;
          if (gameStarted) {
            showQuestion(currentIndex);
          }
        }, 1500);

      } else if (data.lastResult === "WRONG") {
        audioSalah.currentTime = 0;
        audioSalah.play().catch(e => console.log("Gagal memutar audio:", e));

        notifBox.innerHTML = `
          <div class="bg-red-600 text-white font-bold text-xl px-8 py-3 rounded-xl shadow-lg animate-pop">
            ❌ Jawaban Salah! Coba Lagi.
          </div>`;

        setTimeout(() => {
          notifBox.innerHTML = "";
        }, 1500);
      }
    });
  </script>
</body>
</html>
