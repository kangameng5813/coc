<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jawaban (HP)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    /* Background bertema dark metal/slate teal seperti pada gambar */
    body {
      background: radial-gradient(circle at center, #1b333a 0%, #0d171c 100%);
      font-family: 'Times New Roman', Times, serif;
    }

    /* Tampilan layar input angka */
    .display-box {
      background: linear-gradient(180deg, rgba(15,25,30,0.8) 0%, rgba(30,45,55,0.8) 100%);
      border: 3px solid #7a8a9e;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 0 10px rgba(122,138,158,0.3);
      color: #e2e8f0;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    /* Tombol melingkar bernuansa metallic 3D */
    .btn-metal {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7a8288 0%, #4a5056 50%, #26292d 100%);
      border: 3px solid #9aa3ab;
      box-shadow: 
        inset 0 2px 3px rgba(255,255,255,0.6),
        inset 0 -3px 5px rgba(0,0,0,0.8),
        0 4px 8px rgba(0,0,0,0.6),
        0 0 0 2px #1e2226;
      color: #181c20;
      font-family: 'Times New Roman', Times, serif;
      font-weight: 900;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.3), -1px -1px 1px rgba(0,0,0,0.8);
      transition: all 0.08s ease;
      position: relative;
    }

    .btn-metal:active {
      transform: translateY(2px) scale(0.95);
      box-shadow: 
        inset 0 3px 6px rgba(0,0,0,0.9),
        0 1px 3px rgba(0,0,0,0.5);
      background: radial-gradient(circle at 50% 50%, #3e4348 0%, #23272a 100%);
    }

    /* Ikon Khusus Tombol Hapus (Backspace) */
    .icon-backspace {
      display: inline-block;
      width: 28px;
      height: 20px;
      background-color: #22252a;
      clip-path: polygon(30% 0%, 100% 0%, 100% 100%, 30% 100%, 0% 50%);
      position: relative;
    }
    .icon-backspace::after {
      content: "✕";
      color: #7a8288;
      font-size: 11px;
      font-weight: bold;
      position: absolute;
      right: 4px;
      top: 1px;
    }

    /* Ikon Khusus Tombol Kirim (OK / Panah) */
    .icon-send {
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #22252a;
      margin-left: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 select-none relative">

  <!-- Overlay Interaksi Pertama untuk Mengatasi Blokir Audio Browser -->
  <div id="start-overlay" class="fixed inset-0 bg-[#0d171c]/95 z-50 flex flex-col items-center justify-center cursor-pointer text-center p-6 transition-opacity duration-300">
    <div class="border-2 border-[#7a8a9e] bg-[#1b333a] p-8 rounded-2xl shadow-[0_0_20px_rgba(122,138,158,0.4)] max-w-sm w-full">
      <div class="text-4xl mb-4">🔊</div>
      <h2 class="text-white text-xl font-bold mb-2 tracking-wide">SIAPKAN AUDIO</h2>
      <p class="text-[#9aa3ab] text-sm mb-6">Klik di mana saja untuk memulai permainan dan mengaktifkan suara.</p>
      <button class="bg-[#7a8a9e] text-[#0d171c] font-extrabold px-6 py-3 rounded-xl tracking-wider shadow-md hover:bg-[#8fa0b5] transition">
        KETUK UNTUK MULAI
      </button>
    </div>
  </div>

  <div class="w-full max-w-xs flex flex-col items-center">
    
    <!-- Display Output -->
    <div class="w-full rounded-2xl py-3 px-4 mb-8 text-center display-box">
      <span id="display-input" class="text-3xl font-extrabold tracking-widest min-h-[40px] block leading-relaxed"></span>
    </div>

    <!-- Keypad Grid -->
    <div class="grid grid-cols-3 gap-y-5 gap-x-5 place-items-center mb-6">
      <button type="button" onclick="handleInput('1')" class="btn-metal">1</button>
      <button type="button" onclick="handleInput('2')" class="btn-metal">2</button>
      <button type="button" onclick="handleInput('3')" class="btn-metal">3</button>

      <button type="button" onclick="handleInput('4')" class="btn-metal">4</button>
      <button type="button" onclick="handleInput('5')" class="btn-metal">5</button>
      <button type="button" onclick="handleInput('6')" class="btn-metal">6</button>

      <button type="button" onclick="handleInput('7')" class="btn-metal">7</button>
      <button type="button" onclick="handleInput('8')" class="btn-metal">8</button>
      <button type="button" onclick="handleInput('9')" class="btn-metal">9</button>

      <!-- Tombol Hapus (Backspace) -->
      <button type="button" onclick="handleClear()" class="btn-metal">
        <span class="icon-backspace"></span>
      </button>
      
      <button type="button" onclick="handleInput('0')" class="btn-metal">0</button>
      
      <!-- Tombol OK / Submit -->
      <button type="button" onclick="submitAnswer()" class="btn-metal">
        <span class="icon-send"></span>
      </button>
    </div>

    <!-- Status Notifikasi -->
    <p id="status-message" class="text-xl font-extrabold h-8 text-center tracking-wider text-shadow"></p>
  </div>

  <script>
    // Audio Elements
    const soundClick = new Audio('keyboard.mp3');
    const soundBenar = new Audio('benar.mp3');
    const soundSalah = new Audio('salah.mp3');

    // Handle klik overlay pertama untuk membuka blokir audio browser
    const overlay = document.getElementById('start-overlay');
    overlay.addEventListener('click', () => {
      // Unmute/preload dengan memutar lalu langsung di-pause sebentar (teknik unlock audio)
      [soundClick, soundBenar, soundSalah].forEach(sound => {
        sound.play().then(() => {
          sound.pause();
          sound.currentTime = 0;
        }).catch(() => {});
      });

      // Hilangkan overlay dengan transisi halus
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 300);
    });

    function playClickSound() {
      soundClick.currentTime = 0;
      soundClick.play().catch(() => {});
    }

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAfT0bE5CfBIGvzsG_MCSkkKjnnaExlE0o",
      authDomain: "coc-gurusmanj.firebaseapp.com",
      databaseURL: "https://coc-gurusmanj-default-rtdb.firebaseio.com",
      projectId: "coc-gurusmanj",
      storageBucket: "coc-gurusmanj.firebasestorage.app",
      messagingSenderId: "183089432197",
      appId: "1:183089432197:web:67b413ee1ded658ba9cbec"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let questionsList = [];
    let currentQ = 0;
    let currentInputValue = "";

    const displayEl = document.getElementById('display-input');
    const statusEl = document.getElementById('status-message');

    // Sinkronisasi soal aktif dan kunci jawaban dari Firebase
    db.ref('questions').on('value', (snapshot) => {
      const data = snapshot.val();
      questionsList = [];
      if (data) {
        for (let key in data) questionsList.push(data[key]);
      }
    });

    db.ref('game/currentQuestion').on('value', (snapshot) => {
      currentQ = snapshot.val() || 0;
    });

    function handleInput(num) {
      playClickSound();
      if (currentInputValue.length < 8) {
        currentInputValue += num;
        updateDisplay();
      }
    }

    function handleClear() {
      playClickSound();
      currentInputValue = "";
      updateDisplay();
    }

    function updateDisplay() {
      displayEl.innerText = currentInputValue;
    }

    function submitAnswer() {
      playClickSound();
      if (!currentInputValue || questionsList.length === 0) return;

      const correctAnswer = questionsList[currentQ]?.a;

      if (currentInputValue.trim() === String(correctAnswer)) {
        // Notifikasi Benar
        soundBenar.currentTime = 0;
        soundBenar.play().catch(() => {});

        statusEl.className = "text-xl font-extrabold text-center text-emerald-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]";
        statusEl.innerText = "BENAR";
        
        db.ref('game').set({
          currentQuestion: currentQ + 1,
          lastResult: "CORRECT",
          timestamp: Date.now()
        });

        currentInputValue = "";
        updateDisplay();
      } else {
        // Notifikasi Salah
        soundSalah.currentTime = 0;
        soundSalah.play().catch(() => {});

        statusEl.className = "text-xl font-extrabold text-center text-red-500 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]";
        statusEl.innerText = "SALAH";
        
        db.ref('game').update({
          lastResult: "WRONG",
          timestamp: Date.now()
        });

        currentInputValue = "";
        updateDisplay();
      }

      setTimeout(() => { statusEl.innerText = ""; }, 1800);
    }
  </script>
</body>
</html>
